id = "eternity_world_map"
kind = "native-mod"
name = "Eternity world map"
summary = "Zero-overhead native minimap, persistent fullscreen World Map (M), Cave Mode, 2.5D mob radar, and 3D waypoints."
description = """
Zero-overhead native minimap, persistent fullscreen World Map, Cave Mode, 2.5D mob head radar, and interactive 3D/radar waypoints written in Rust for Horizon (Minecraft `26.3`).

- **Minimap HUD**: Square and smooth Round shapes, adjustable size (`64–256 px`), zoom, corner placement, and player rotation lock.
- **Fullscreen World Map (`M`)**: Multi-tier mip-pyramid (`1:1`, `2:1`, `4:1`, `8:1`) eliminates zoom-out blur; includes background `512x512` area preload (in single-player, samples local world generation to reveal unexplored terrain around the target area; on servers, rescans loaded chunks), chunk grid toggle, cursor biome/coordinate readout, and right-click menu (`Teleport Here` sends `/tp <x> <y> <z>`, `Copy coords`, `New waypoint`).
- **Cave Mode**: Auto/Manual/Off switcher bar with Y-slice slider (`-64..320`), pure black void outside caverns, roof-verified scanning so open surface terrain never bleeds in, and smooth Y transitions.
- **2.5D Mob & Player Radar**: Compact diamonds by default; hold `Tab` to render multi-layer vanilla mob heads (snouts, beaks, noses, ears, horns, emissive eye overlays, and baby sizing) and player skins.
- **Waypoints**: Click any coordinate on the World Map or press `B` to create named color waypoints with in-world 3D beams, minimap rim clamping, and optional auto Death waypoints.

Client-side only with zero external network access. Passive map, radar, and waypoint rendering does not mutate world state; right-click **Teleport** sends a standard `/tp` chat command when invoked.

- Pinned to Horizon Nightly `2026-11-20` (`0a875da91dbb0fdcb7ba8c42c11341aa229af51a`) and `horizon-mixins` `e59da9094f0c2fdda6c627fe9eff22dec6a906f0`.
"""
