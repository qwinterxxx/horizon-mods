id = "gamma"
kind = "native-mod"
name = "Gamma"
summary = "Ultra-lightweight Gamma boost toggle (1500%) that preserves options.txt."
description = """
Ultra-lightweight native Gamma mod for Horizon that toggles render brightness boost (`1500%`) without modifying saved `options.txt`.

- Press **G** (rebindable in **Options > Controls**) to toggle the `1500%` gamma boost on or off with a brief status message.
- Can also be toggled in **Options > Mods > Gamma**.
- Writes only to `renderer.gamma`, leaving `settings.gamma` (`options.txt`) untouched: your configured brightness survives options saves while boosted, disabling boost restores your exact configured brightness, and removing the mod leaves zero stale `1500%` values in `options.txt`.
- Respects Horizon's external-server fullbright restriction (`fullbright_held`): leaves normal brightness intact on external servers and LAN guest sessions while staying active in singleplayer, hosted LAN worlds, and Replay Studio.
- Zero allocations on idle frames.
- Pinned to Horizon Nightly `2026-11-20` (`0a875da91dbb0fdcb7ba8c42c11341aa229af51a`) and `horizon-mixins` `e59da9094f0c2fdda6c627fe9eff22dec6a906f0`.
"""
